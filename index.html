ated to the pursuit of Teaching Vedantha. The initial core group of seekers gathers.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"md:pl-12 w-full overflow-hidden\">\n              <div class=\"flex gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory pb-4\">\n                <div class=\"snap-start shrink-0 w-64 md:w-72 h-48 border border-earth-brown/20 rounded-sm bg-cover bg-center bg-surface-container-low\" style=\"background-image:url(&quot;assets/ea940b25-a953-45a2-9abb-07786f260453.jpg&quot;)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <!-- 2020 -->\n          <div class=\"relative grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16 items-center\">\n            <div class=\"hidden md:flex absolute left-1/2 top-8 -translate-x-1/2 w-4 h-4 bg-background border-2 border-primary rounded-full z-10\"><\u002Fdiv>\n            <div class=\"md:col-start-2 md:pl-12 order-1 md:order-2\">\n              <div class=\"font-headline-display text-headline-display text-earth-brown/40 mb-2\">2021<\u002Fdiv>\n              <h2 class=\"font-headline-md text-headline-md text-primary mb-4\">1st 4 Year batch commencement<\u002Fh2>\n              <p class=\"font-body-md text-body-md text-on-surface-variant mb-6 md:mb-0\">Acharya ji  started the first 4 year course in Chennai, where over 100 plus people enrolled in which 12 principle upanishads, prakaranams and Bhagavath geetha texts were studied from 2021 to 2025<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"md:col-start-1 md:text-right md:pr-12 w-full overflow-hidden order-2 md:order-1 flex justify-end\">\n              <div class=\"flex gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory pb-4 w-full md:w-auto\">\n                <div class=\"snap-start shrink-0 w-64 md:w-72 h-48 border border-earth-brown/20 rounded-sm bg-cover bg-center bg-surface-container-low\" style=\"background-image:url(&quot;assets/a64c8762-e6c7-47fb-9ad3-c29a7a181eba.jpg&quot;)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- 2022 -->\n          <div class=\"relative grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16 items-center\">\n            <div class=\"hidden md:flex absolute left-1/2 top-8 -translate-x-1/2 w-4 h-4 bg-background border-2 border-primary rounded-full z-10\"><\u002Fdiv>\n            <div class=\"md:text-right md:pr-12\">\n              <div class=\"font-headline-display text-headline-display text-earth-brown/40 mb-2\">2022<\u002Fdiv>\n              <h2 class=\"font-headline-md text-headline-md text-primary mb-4\">Thathtwamasi Batch - Coimbature<\u002Fh2>\n              <p class=\"font-body-md text-body-md text-on-surface-variant mb-6 md:mb-0\">Acharya out of his compassion started a new batch at Coimbature, where weekly classes were held throughout the year along with camps and yatras.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"md:pl-12 w-full overflow-hidden\">\n              <div class=\"flex gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory pb-4\">\n                <div class=\"snap-start shrink-0 w-64 md:w-72 h-48 border border-earth-brown/20 rounded-sm bg-cover bg-center bg-surface-container-low\" style=\"background-image:url(&quot;assets/fb810f36-53d8-4bc7-87a2-d0ae1964a1f8.jpg&quot;)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- 2024a -->\n          <div class=\"relative grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16 items-center\">\n            <div class=\"hidden md:flex absolute left-1/2 top-8 -translate-x-1/2 w-4 h-4 bg-background border-2 border-primary rounded-full z-10\"><\u002Fdiv>\n            <div class=\"md:col-start-2 md:pl-12 order-1 md:order-2\">\n              <div class=\"font-headline-display text-headline-display text-earth-brown/40 mb-2\">2024<\u002Fdiv>\n              <h2 class=\"font-headline-md text-headline-md text-primary mb-4\">Chennayil Ayodhya - Ramayana Mahotsvam<\u002Fh2>\n              <p class=\"font-body-md text-body-md text-on-surface-variant mb-6 md:mb-0\">A 48 day continous Valmiki Ramayana pravachanam was conducted by Acharya ji with over 300 students attending in person and over 1000 people listened online where the last day was concluded as Grand event in Vani mahal with over 800 people participating, on the occasion of Shree Rama Navami.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"md:col-start-1 md:text-right md:pr-12 w-full overflow-hidden order-2 md:order-1 flex justify-end\">\n              <div class=\"flex gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory pb-4 w-full md:w-auto\">\n                <div class=\"snap-start shrink-0 w-64 md:w-72 h-48 border border-earth-brown/20 rounded-sm bg-cover bg-center bg-surface-container-low\" style=\"background-image:url(&quot;assets/ecd3af26-f5f5-49b2-8422-cbb3bf6698d9.jpg&quot;)\"><\u002Fdiv>\n                <div class=\"snap-start shrink-0 w-64 md:w-72 h-48 border border-earth-brown/20 rounded-sm bg-cover bg-center bg-surface-container-low\" style=\"background-image:url(&quot;assets/5c9837a8-69c5-4984-90f6-ab7bb69af49d.jpg&quot;)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- fade veil above Load More -->\n        <sc-if value=\"{{ showMoreHidden }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(to bottom, transparent, #fefccf 45%);pointer-events:none;\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Load More Button -->\n        <sc-if value=\"{{ showMoreHidden }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;justify-content:center;margin-top:48px;\">\n          <button style=\"display:inline-flex;align-items:center;gap:10px;background:#2D2926;color:#FFFDD0;font-size:12px;letter-spacing:0       <span class=\"font-label-sm text-label-sm text-secondary mb-2 block\">Annual Retreat \u00b7 5 Days<\u002Fspan>\n                <h4 class=\"font-headline-md text-headline-md text-primary mb-3\">Kerala Vedanta Camp<\u002Fh4>\n                <p class=\"font-body-md text-body-md text-on-surface-variant mb-4 flex-grow\">A 5-day residential camp held at a serene ashram in Kerala's lush backwaters. Deep study of Bhagavad Gita chapters, group discussions and traditional Kerala worship (Puja) form the heart of this retreat \u2014 a perfect blend of contemplation and devotion.<\u002Fp>\n                <div class=\"flex items-center justify-between gap-4 mb-4 border-t border-earth-brown/10 pt-4\">\n                  <div class=\"flex items-center gap-4\">\n                    <span class=\"flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant\"><span class=\"material-symbols-outlined text-sm\">calendar_month<\u002Fspan> Oct 2024<\u002Fspan>\n                    <span class=\"flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant\"><span class=\"material-symbols-outlined text-sm\">group<\u002Fspan> 34 Seekers<\u002Fspan>\n                  <\u002Fdiv>\n                  <button class=\"flex items-center gap-2 bg-khadi-text text-soft-cream px-4 py-2 font-label-sm text-label-sm uppercase tracking-wider hover:bg-secondary transition-colors cursor-pointer rounded-sm\" onclick=\"{{ openGallery1 }}\"><span class=\"material-symbols-outlined text-sm\">photo_library<\u002Fspan> Gallery<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Farticle>\n\n            <!-- Card 3: Brahmasutra -->\n            <article class=\"group border border-earth-brown/20 rounded-lg overflow-hidden bg-surface-container hover:bg-surface-container-high transition-colors duration-500 flex flex-col\">\n              <div class=\"aspect-[16/9] relative overflow-hidden border-b border-earth-brown/10\">\n                <img alt=\"Brahmasutra Camp\" class=\"w-full h-full object-cover transition-transform duration-700 group-hover:scale-105\" src=\"assets/6f980737-4770-4ee8-9105-4b520dbd5944.png\">\n                <div class=\"absolute top-3 left-3 bg-earth-brown text-soft-cream font-label-sm text-label-sm px-3 py-1 rounded uppercase tracking-wider\">Advanced<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"p-6 flex-grow flex flex-col\">\n                <span class=\"font-label-sm text-label-sm text-secondary mb-2 block\">Advanced Seekers \u00b7 3 Days<\u002Fspan>\n                <h4 class=\"font-headline-md text-headline-md text-primary mb-3\">Brahmasutra Intensive<\u002Fh4>\n                <p class=\"font-body-md text-body-md text-on-surface-variant mb-4 flex-grow\">A focused 3-day camp for advanced Vedanta students, covering selected adhikaranas from the Brahmasutras \u2014 the ultimate systematic inquiry into the nature of Brahman. Prior study of Tattva Bodha and Bhagavad Gita is recommended.<\u002Fp>\n                <div class=\"flex items-center justify-between gap-4 mb-4 border-t border-earth-brown/10 pt-4\">\n                  <div class=\"flex items-center gap-4\">\n                    <span class=\"flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant\"><span class=\"material-symbols-outlined text-sm\">calendar_month<\u002Fspan> Aug 2024<\u002Fspan>\n                    <span class=\"flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant\"><span class=\"material-symbols-outlined text-sm\">group<\u002Fspan> 18 Seekers<\u002Fspan>\n                  <\u002Fdiv>\n                  <button class=\"flex items-center gap-2 bg-khadi-text text-soft-cream px-4 py-2 font-label-sm text-label-sm uppercase tracking-wider hover:bg-secondary transition-colors cursor-pointer rounded-sm\" onclick=\"{{ openGallery2 }}\"><span class=\"material-symbols-outlined text-sm\">photo_library<\u002Fspan> Gallery<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Farticle>\n\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- \u2500\u2500 BVM YUVA KENDRA CONTENT \u2500\u2500 -->\n      <sc-if value=\"{{ showInitYuva }}\" hint-placeholder-val=\"{{ false }}\">\n        <section class=\"mb-section-gap\">\n          <div>\n            <span class=\"font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-2 block\">For Ages 8\u201325<\u002Fspan>\n            <h2 class=\"font-headline-lg-mobile md:text-headline-lg text-primary font-headline-lg mb-6\">BVM Yuva Kendra<\u002Fh2>\n          <\u002Fdiv>\n          <div class=\"space-y-4 font-body-lg text-body-lg text-on-surface-variant max-w-3xl\">\n            <p>BVM Yuva Kendra serves youth ages 8-25 with a purpose to imbibe our deep rooted cultural values and traditions among young minds through value education, pooja, seva and games \u2014 in order to equip them to be self reliant and hence responsible citizens of the nation.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n\n    <footer class=\"bg-khadi-text w-full pt-16\">\n      <div class=\"max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop\">\n        <div class=\"flex flex-wrap justify-between gap-gutter py-gutter border-b border-soft-cream/10\">\n          <div class=\"w-full md:w-auto mb-4 md:mb-0\">\n            <h3 class=\"font-headline-md text-headline-md text-soft-cream mb-3\">Brahma Vidya Mandir<\u002Fh3>\n            <p class=\"font-body-md text-body-md text-soft-cream/50 max-w-xs\">A community dedicated to the pursuit of Self-knowledge and the service of humanity in the light of Advaita Vedanta.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h4 class=\"font-label-sm text-label-sm text-divine-saffron uppercase tracking-widest mb-4\">Explore<\u002Fh4>\n            <div class=\"flex flex-col gap-3\">\n              <span class=\"font-bo y-unit flex items-center justify-center\">\n          <p class=\"font-label-sm text-label-sm text-soft-cream/30\">\u00a9 Brahma Vidya Mandir. All rights reserved.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fsc-if>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <!-- PARAMPARA PAGE                              -->\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <sc-if value=\"{{ isParampara }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-margin-desktop md:py-section-gap pb-16 relative\">\n      <section class=\"text-center mb-section-gap relative z-10\">\n        <h1 class=\"font-headline-display text-headline-display md:text-5xl text-khadi-text mb-6\">Guru Parampara Lineage<\u002Fh1>\n        <p class=\"font-headline-md text-headline-md text-earth-brown italic leading-relaxed max-w-2xl mx-auto mb-2\">\"\u0938\u0926\u093e\u0936\u093f\u0935 \u0938\u092e\u093e\u0930\u092e\u094d\u092d\u093e\u0902 \u0936\u0919\u094d\u0915\u0930\u093e\u091a\u093e\u0930\u094d\u092f \u092e\u0927\u094d\u092f\u092e\u093e\u092e\u094d \u0964 \u0905\u0938\u094d\u092e\u0926\u093e\u091a\u093e\u0930\u094d\u092f\u092a\u0930\u094d\u092f\u0928\u094d\u0924\u093e\u0902 \u0935\u0928\u094d\u0926\u0947 \u0917\u0941\u0930\u0941\u092a\u0930\u092e\u094d\u092a\u0930\u093e\u092e\u094d \u0965\"<\u002Fp>\n        <p class=\"font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto\">Salutations to Ishwara, Adi Shankaracharya, and one's own Guru now in this lineage.<\u002Fp>\n      <\u002Fsection>\n      <section class=\"space-y-gutter relative\">\n        <div class=\"hidden md:block absolute left-1/2 top-0 bottom-0 w-px bg-earth-brown/20 -translate-x-1/2 z-0\"><\u002Fdiv>\n        <!-- Adi Shankara -->\n        <article class=\"flex flex-col md:flex-row items-center gap-margin-desktop relative z-10\">\n          <div class=\"w-full md:w-1/2 flex justify-center md:justify-end\">\n            <div class=\"w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border border-earth-brown/20 bg-surface-container p-2\">\n              <img class=\"w-full h-full object-cover rounded-full\" alt=\"Adi Shankaracharya\" src=\"assets/58ccaf24-49cf-4c67-bc69-65a4c0f73903.webp\" style=\"object-fit: cover\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"w-full md:w-1/2 text-center md:text-left\">\n            <h2 class=\"font-headline-lg text-headline-lg-mobile md:text-headline-lg text-forest-depth mb-2\">Adi Shankara<\u002Fh2>\n            <h3 class=\"font-label-sm text-label-sm text-earth-brown uppercase tracking-widest mb-4\">The Reviver of Advaita<\u002Fh3>\n            <p class=\"font-body-md text-body-md text-on-surface-variant max-w-md mx-auto md:mx-0\">The bedrock of our philosophical understanding. Adi Shankaracharya unified the diverse streams of Hindu thought by elucidating the non-dualistic reality (Brahman). His profound commentaries continue to light the path of our spiritual inquiry, emphasizing that the self and the absolute are one.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <!-- Pujya Sri Swami Dayananda Saraswati -->\n        <article class=\"flex flex-col md:flex-row-reverse items-center gap-margin-desktop relative z-10 pt-margin-desktop\">\n          <div class=\"w-full md:w-1/2 flex justify-center md:justify-start\">\n            <div class=\"w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border border-earth-brown/20 bg-surface-container p-2\">\n              <img class=\"w-full h-full object-cover rounded-full\" alt=\"Swami Dayananda Saraswati\" src=\"assets/7b2e4b21-2949-47b6-8563-06d9e820b615.jpg\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"w-full md:w-1/2 text-center md:text-right\">\n            <h2 class=\"font-headline-lg text-headline-lg-mobile md:text-headline-lg text-forest-depth mb-2\" style=\"text-align: right\">Pujya Sri Swami Dayananda Saraswati<\u002Fh2>\n            <h3 class=\"font-label-sm text-label-sm text-earth-brown uppercase tracking-widest mb-4\">A Distinguished, Traditional Teacher of Vedanta<\u002Fh3>\n            <p class=\"font-body-md text-body-md text-on-surface-variant max-w-md mx-auto md:mx-0 md:ml-auto\">Pujya Sri Swami Dayananda Saraswati is noted for his depth of understanding and nuanced appreciation of both Eastern and Western cultures, and stands among the foremost traditional teachers of Vedanta in the modern era.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <!-- Swami Paramarthananda -->\n        <article class=\"flex flex-col md:flex-row items-center gap-margin-desktop relative z-10 pt-margin-desktop\">\n          <div class=\"w-full md:w-1/2 flex justify-center md:justify-end\">\n            <div class=\"w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border border-earth-brown/20 bg-surface-container p-2\">\n              <img class=\"w-full h-full object-cover rounded-full\" alt=\"Swami Paramarthananda\" src=\"assets/d780aeef-45a8-47bf-940b-637ae7638eeb.jpg\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"w-full md:w-1/2 text-center md:text-left\">\n            <h2 class=\"font-headline-lg text-headline-lg-mobile md:text-headline-lg text-forest-depth mb-2\">Swami Paramarthananda&nbsp;<\u002Fh2>\n            <h3 class=\"font-label-sm text-label-sm text-earth-brown uppercase tracking-widest mb-4\">The Spiritual Successor<\u002Fh3>\n            <p class=\"font-body-md text-body-md text-on-surface-variant max-w-md mx-auto md:mx-0\">Swami Paramarthananda studied at Sandeepany Sadhanalaya of Chinmaya Mission and took Sanyasa from Swami Dayananda, devoted to both his Masters \u2014 Swami Chinmayananda and Swami Dayananda. He carries forward the traditional method of scriptural exposition (Sampradaya).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsection>\n\n      <!-- Featured spotlight: Swami Brahmayogananda -->\n      <section class=\"mt-section-gap relative z-10\">\n        <div class=\"bg-surface-container-high border border-earth-brown/20 rounded-xl p-margin-mobile md:p-margin-desktop flex flex-col md:flex-row items-center gap-margin-desktop\">\n          <div class=\"w-64 h-64 md:w-72 md:h-72 rounded-full overflow-hidden border-4 border-primary/20 bg-surface-container p-2 flex-shrink-0\">\n            <img class=\"w-full h-full object-cover rounded-full\" alt=\"Shri Swami Brahmayogananda\" src=\"assets/beff88c3-85eb-41ab-9008-0e2229309bce.jpg\">\n          <\u002Fdiv>\n          <div class=\"text-center md:text-left\">\n            <span class=\"font-label-sm text-label-sm text-secondary uppercase tracking-widest\">Founder, Yoga Shanthi Gurukulam<\u002Fspan>\n            <h2 class=\"font-headline-lg text-headline-lg text-forest-depth mt-2 mb-4\">Shri Swami Brahmayogananda<\u002Fh2>\n            <p class=\"font-body-md text-body-md text-on-surface-variant max-w-xl mx-auto md:mx-0\">Shri Swami Brahmayogananda served the nation for over 25 years through the Rashtriya Swayamsevak Sangh (RSS) before founding the Yoga Shanthi Gurukulam. He is Acharya Shri Rangaji's Guru, who initiated him into the traditional teaching lineage to advance the vision of Vedanta.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Quote Divider -->\n      <section class=\"mt-section-gap text-center relative z-10\">\n        <span class=\"font-label-sm text-label-sm text-secondary uppercase tracking-widest\">Acharya-ji's Guru<\u002Fspan>\n        <p class=\"font-headline-md text-headline-md text-earth-brown italic leading-relaxed max-w-2xl mx-auto mt-4\">\"Compassion, Knowledge, Motherly Care, Desha Bhakthi, Karma Yogam &amp; discipline.\"<\u002Fp>\n        <p class=\"font-label-sm text-label-sm text-outline mt-3\">\u2014 on Shri Swami Brahmayogananda<\u002Fp>\n      <\u002Fsection>\n    <\u002Fmain>\n    <!-- Brahma Vidya Acharyas -->\n    <section class=\"relative z-10\" style=\"width:100%;padding:64px 24px;background:#fffef5;\">\n      <div style=\"max-width:1280px;margin:0 auto;\">\n        <div class=\"text-center mb-12\">\n          <span class=\"font-label-sm text-label-sm text-secondary uppercase tracking-widest\">Carrying the Lineage Forward<\u002Fspan>\n          <h2 class=\"font-headline-lg text-headline-lg text-khadi-text mt-2 mb-4\">Brahma Vidya Acharyas<\u002Fh2>\n          <p class=\"font-body-md text-body-md text-on-surface-variant max-w-2xl mx-auto\">Traditional teachers of Vedanta, co-students in the lineage, conducting regular classes and carrying the wisdom of the shastras forward across communities.<\u002Fp>\n        <\u002Fdiv>\n        <div id=\"acharyas-carousel\" style=\"display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:none;-ms-overflow-style:none;\">\n          <div data-team-card=\"acharya1\" onmouseenter=\"{{ acharyaTeam1MouseEnter }}\" onmouseleave=\"{{ acharyaTeam1MouseLeave }}\" style=\"position:relative;width:277px;height:380px;flex-shrink:0;scroll-snap-align:start;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.10);\">\n            <img src=\"assets/4906aba3-2b4c-4fec-8d63-e320a5a4c018.jpg\" alt=\"Acharya Shri Vasudevan Kalyanaraman\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:20px 22px;background:linear-gradient(to top, rgba(20,15,10,0.88) 0%, rgba(20,15,10,0.3) 60%, transparent 100%);pointer-events:none;\">\n              <h3 style=\"font-size:17px;font-weight:600;color:#FFFDD0;margin:0 0 4px;\">Acharya Shri Vasudevan Kalyanaraman<\u002Fh3>\n              <span style=\"font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,253,208,0.75);\">Vasu Ji<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px;background:rgba(35,26,18,0.42);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity 0.35s ease;opacity:{{ acharyaTeam1Opacity }};\">\n              <h3 style=\"font-size:16px;font-weight:600;color:#FFFDD0;margin:0 0 12px;\">Acharya Shri Vasudevan Kalyanaraman<\u002Fh3>\n              <p style=\"font-size:13.5px;color:rgba(255,253,208,0.92);line-height:1.75;margin:0;\">A traditional teacher of Vedanta conducting classes in Chennai, balancing his work as a software professional with family life and dedicated spiritual practice.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-team-card=\"acharya2\" onmouseenter=\"{{ acharyaTeam2MouseEnter }}\" onmouseleave=\"{{ acharyaTeam2MouseLeave }}\" style=\"position:relative;width:277px;height:380px;flex-shrink:0;scroll-snap-align:start;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.10);\">\n            <img src=\"assets/499883de-c9a6-4852-b523-09f9ae976e4f.jpg\" alt=\"Acharya Smt. Suryapriya Rangarajan\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:20px 22px;background:linear-gradient(to top, rgba(20,15,10,0.88) 0%, rgba(20,15,10,0.3) 60%, transparent 100%);pointer-events:none;\">\n              <h3 style=\"font-size:17px;font-weight:600;color:#FFFDD0;margin:0 0 4px;\">Acharya Smt. Suryapriya Rangarajan<\u002Fh3>\n              <span style=\"fo t:cover;object-position:top center;display:block;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- Stand foot decorative line -->\n            <div style=\"width:60%;height:3px;background:linear-gradient(90deg,transparent,rgba(140,90,40,0.3),transparent);margin:0 auto;margin-top:2px;border-radius:2px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <div class=\"space-y-8\">\n          <div class=\"space-y-2\">\n            <h2 class=\"font-headline-lg text-headline-lg text-khadi-text\">Acharya Shri Rangarajan Kalyanaraman<\u002Fh2>\n            <p class=\"font-label-sm text-label-sm text-earth-brown uppercase tracking-widest\">Vedanta Acharya \u00b7 Brahma Vidya Mandir<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"space-y-5 font-body-lg text-body-lg text-on-surface-variant leading-relaxed\">\n            <p>Rangaji is a student disciple of Guruji Shri Swami Brahmayogananda. He was initiated into the traditional teaching lineage to advance the vision of Vedanta, and assumed the Vyasa Peetham in September 2014.<\u002Fp>\n            <p>Born to Smt. Lalitha Kalyanaraman and Bagavatha Sironmani Shri V V Kalyanaraman, he comes from a Bhagavatha Sampradaya family steeped in bhakti and vedic tradition, and received Veda Adyayanam initiation during childhood.<\u002Fp>\n            <p>A Chartered Accountant by qualification, Rangaji's primary focus is shastra study and instruction. His lucid style of teaching, coupled with real-life examples in his engaging one-hour sessions, has enabled many students to see the relevance of the shastras in daily life \u2014 strictly adhering to the traditional teaching system descended from Adi Guru Dakshinamurthy through Bhagavan Veda Vyasa and Adi Shankara Bhagavadpada.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Teaching Approach -->\n      <section class=\"mb-section-gap bg-surface-container-low rounded-xl p-10 md:p-16 border border-eart ex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pt-24 pb-section-gap\">\n      <section class=\"text-center max-w-3xl mx-auto mb-section-gap\">\n        <h1 class=\"font-headline-display text-headline-lg-mobile md:text-headline-display text-khadi-text mb-6\">Vision of Vedanta<\u002Fh1>\n        <p class=\"font-body-lg text-body-lg text-on-surface-variant leading-relaxed italic\">Jiva Brahma Aikyam \u2014 the identity of the individual self and the absolute.<\u002Fp>\n      <\u002Fsection>\n      <section class=\"max-w-3xl mx-auto\">\n        <div class=\"flex flex-col gap-5 rounded-2xl p-6 md:p-10 border\" style=\"background-image:linear-gradient(135deg, #f4a988, #e88a63);border-color:rgba(148,73,37,0.22);\">\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">Vedanta is the teaching of the reality of oneself. It is in the form of inquiry herein one discovers the real meaning of the word 'I' the self that remains unchanged from the childhood to youth to old age. It leads one to discover that the unchanged self is free from any form of limitation.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">The vision of Vedanta is an equation of the identity between the jiva, individual and Ishvara. This vision of oneness is not available for perception or inference. Nor is the oneness that is unfolded by Vedanta contradicted by perception or inference. Oneness is purely in terms of understanding the equation.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">The entire vision of Vedanta expressed in one sentence \u2013 tat tvam asi. This sentence is a mahavakya, the central theme of our scriptures. All other sentences in the Upanishads are only meant to prove this equation.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">To recognize the truth unfolded by vedanta one requires a prepared mind. For the one with an unprepared mind, Vedanta is like calculus for a person who is still learning basic mathematics. To gain such a mind implies the recognition, the importance and the understanding of certain values and attitudes.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">In the vision of the Veda, self-growth is the aim that will lead you to self-discovery. Whether you say dharma or karma it is one and the same. Dharma in terms of its expression, in a given situation, becomes karma, what is to be done.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">The vision of the Vedas, being what it is, advocates a lifestyle that is entirely unique. Since you are already a complete person, the tradition is only an aid to help you discover this profound truth. Nobody rests content with what he or she is. Inspite of one’s accomplishments and skills, one always has a sense of inadequacy.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">To discover this, however, one must be mature. One’s physical maturity (adulthood) does not assure emotional maturity. One can remain as angry, self-centred, jealous and hateful as one was in childhood. However, as an adult one has to grow out of these tendencies and become emotionally mature. The Veda gives us a plan to make ourselves mature. It teaches a lifestyle and value structure that helps us grow so well that we can discover we are the ‘whole’.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">Since it is based on knowledge, it is not confined to a culture of a particular time, nation or geography. Gaining knowledge is neither difficult not easy. It appears difficult if you are not ready, but if you are, there is nothing easier. In case of Vedanta what you want to know is what you want to be. This is unlike any other knowledge.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">Naturally one requires a unique preparedness that the Vedas prescribe as a life of duties. One’s duties are broadly given under two categories \u2013 duties in society (varna dharma \u2013 brahmana, vaishya, kshatriya and shudra based on one’s duty and not on one’s birth / family caste) and duties in one’s personal life (ashrama dharma \u2013 brahmacharya, gruhastha, vanaprastha, sannyasa).<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">Even though today in our society, we do not follow the varna system anywhere by birth, the four-fold spheres of work are always there. We have to understand the spirit of the system. The spirit is duty. No matter under which varna and ashrama one falls under one has to work towards his or her self-discovery by neutralizing his or her like and dislikes. For this one must give precedence to values.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">Through the system of duties imbibed with values, the vision of the Veda is designed to make everyone’s disposition predominantly sattva. In other words, a brahmana by guna. One may or may not be a brahmana by birth or karma. That is not important. Where one does his job as Ishvara aradhana, then any work becomes an outcome of one’s devotion performing puja in a temple is not different from sweeping the floor. This is our culture.<\u002Fp>\n          <p class=\"font-body-lg text-body-lg leading-relaxed\" style=\"color:#4e4634;\">This system is designed to lift one to gain the required maturity to understand the truth, that he or she is not different from the Lord himself.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n    <footer class=\"bg-khadi-text w-full pt-16\">\n      <div class=\"max-w-container-max mx-auto px-margin-mobile md:px
